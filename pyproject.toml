[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpert-ad-targeting"
version = "1.0.0"
description = "Automated POS monitoring and OCR processing application"
readme = "README.md"
license = "MIT"
authors = [
    {name = "XPERT Team", email = "support@xpert.chat"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
requires-python = ">=3.8"
keywords = ["pos", "monitoring", "ocr", "automation", "gui"]
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=9.0.0",
    "pytesseract>=0.3.10",
    "opencv-python>=4.5.0",
    "pymongo>=4.0.0",
    "boto3>=1.26.0",
    "python-dotenv>=0.19.0",
    "keyboard>=0.13.5",
    "pyautogui>=0.9.54",
    "pygetwindow>=0.0.9",
    "requests>=2.28.0",
    "numpy>=1.21.0",
    "scikit-image>=0.19.0",
    "scipy>=1.7.0",
]

[project.scripts]
xpert-ad-targeting = "Project_Xpert:run"

[project.urls]
"Bug Reports" = "https://github.com/xpert-team/xpert-ad-targeting/issues"
"Source" = "https://github.com/xpert-team/xpert-ad-targeting"

[tool.setuptools]
packages = ["Project_Xpert"]

[tool.setuptools.package-data]
"Project_Xpert" = ["*.jpeg", "*.jpg", "*.png"]
"*" = ["Tesseract-OCR/**/*", "config/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.pyc", "*.pyo", "*.pyd", "venv/*", "logs/*", "*.env"] 